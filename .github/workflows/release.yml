name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.binary_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            target: bun-darwin-arm64
            binary_name: rcd-darwin-arm64
          - os: macos-14
            target: bun-darwin-x64
            binary_name: rcd-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            binary_name: rcd-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile standalone binary
        run: |
          bun build --compile --minify --target=${{ matrix.target }} src/cli.ts --outfile ${{ matrix.binary_name }}
          chmod +x ${{ matrix.binary_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist-binaries
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v0.1.0' }}
          files: |
            ./dist-binaries/rcd-darwin-arm64
            ./dist-binaries/rcd-darwin-x64
            ./dist-binaries/rcd-linux-x64
          generate_release_notes: true
